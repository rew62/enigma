#
# Full path to cava-output file.  (in double quotes!!)
#
# /dev/shm = RAM and faster then /tmp !
#
# v1 2026-07-04 @rew62
cavaout="/dev/shm/cava-output"
eqconfig="/dev/shm/eq-config"
default_config="16"
showlabel="auto"
# showlabel options: "on" = always visible | "auto" = show 5s after config change | "off" = hidden
#
#
# Show config output at start of conky [on|off]
showconfig="on"
#
# Live edit mode: reloads spectrum config every frame (performance hit - for config design only)
# Uncomment in settings.ini AND uncomment live_edit lines in cava-spectrum.lua to enable
live_edit="off"